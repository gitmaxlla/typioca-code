name: CI

on:
  push:
    tags:
      - "*"
    branches:
      - master
      - main
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      # Test
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Build
      - name: Build all
        run: make build-all

      # Upload artifacts
      - name: Upload typioca-win-amd64
        uses: actions/upload-artifact@v4
        with:
          name: typioca-win-amd64
          path: src/execs/typioca-win-amd64.exe
      - name: Upload typioca-win-arm64
        uses: actions/upload-artifact@v4
        with:
          name: typioca-win-arm64
          path: src/execs/typioca-win-arm64.exe
      - name: Upload typioca-linux-amd64
        uses: actions/upload-artifact@v4
        with:
          name: typioca-linux-amd64
          path: src/execs/typioca-linux-amd64
      - name: Upload typioca-mac-amd64
        uses: actions/upload-artifact@v4
        with:
          name: typioca-mac-amd64
          path: src/execs/typioca-mac-amd64
      - name: Upload typioca-mac-arm64
        uses: actions/upload-artifact@v4
        with:
          name: typioca-mac-arm64
          path: src/execs/typioca-mac-arm64

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: execs
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: typioca ${{ github.ref_name }}
          files: execs/**/*
  winget:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: bloznelis.typioca
          version: ${{ github.ref_name }}
          token: ${{ secrets.PUBLIC_REPO_ACCESS }}
